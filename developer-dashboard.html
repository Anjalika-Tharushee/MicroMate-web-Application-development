<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Dashboard - MicroMate</title>
    <script>
        // Apply theme before page rendering
        (function () {
            try {
                var savedTheme = localStorage.getItem("micromateTheme");
                if (savedTheme === "light" || savedTheme === "dark") {
                    document.documentElement.setAttribute("data-theme", savedTheme);
                }
            } catch (error) { }
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .dashboard-container {
            max-width: 1200px;
            margin: 6rem auto 4rem;
            padding: 0 5%;
        }
        .welcome-box {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .request-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
        }
        .status-msg {
            font-weight: 500;
            color: orange;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="images/logo.png" alt="MicroMate Logo">
            </div>
            <ul class="nav-links">
                <li><a href="developer-dashboard.html" class="active">Developer Console</a></li>
                <li><a href="options.html">View Messages</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            <div class="nav-buttons">
                <button type="button" class="theme-toggle">
                    <i class="fas fa-moon moon-icon"></i>
                </button>
                <div id="loggedInLinks" style="display: flex; align-items: center; gap: 15px;">
                    <span id="userDisplayName" style="font-weight: 600; color: #3b82f6;">Developer</span>
                    <button id="logoutBtn" class="btn btn-outline" style="padding: 8px 15px;">Logout</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="dashboard-container">
        <div class="welcome-box">
            <h2>Developer Dashboard: Welcome, <span id="developerName">Developer</span>! 💻🚀</h2>
            <p>Browse through incoming customer service requests and start bidding on projects.</p>
        </div>

        <h3>Incoming Customer Project Requests</h3>
        <div id="loadingRequests" class="status-msg">Loading active customer requests...</div>
        
        <div id="requestsGrid" class="dashboard-grid">
            </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script src="auth-status.js"></script>
    <script src="developer-dashboard.js"></script>
</body>
</html>
