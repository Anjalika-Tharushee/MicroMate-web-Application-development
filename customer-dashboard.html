<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - MicroMate</title>
    <script>
        // Apply theme before page rendering
        (function () {
            try {
                var savedTheme = localStorage.getItem("micromateTheme");
                if (savedTheme === "light" || savedTheme === "dark") {
                    document.documentElement.setAttribute("data-theme", savedTheme);
                }
            } catch (error) { }
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .dashboard-container {
            max-width: 1200px;
            margin: 6rem auto 4rem;
            padding: 0 5%;
        }
        .welcome-box {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .service-card {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
        }
        html[data-theme="dark"] .service-card {
            background: rgba(15, 23, 42, 0.78);
        }
        .status-msg {
            font-weight: 500;
            color: orange;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="images/logo.png" alt="MicroMate Logo">
            </div>
            <ul class="nav-links">
                <li><a href="customer-dashboard.html" 
                    >Dashboard</a></li>
                <li><a href="home.html">Home</a></li>
                <li><a href="post-request.html">Post Request</a></li>
                <li><a href="how-it-works.html">How it works</a></li>
                <li><a href="options.html">Options</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            <div class="nav-buttons">
                <button type="button" class="theme-toggle">
                    <i class="fas fa-moon moon-icon"></i>
                </button>
                <div id="loggedInLinks" style="display: flex; align-items: center; gap: 15px;">
                    <span id="userDisplayName" style="font-weight: 600; color: var(--primary);">Customer</span>
                    <button id="logoutBtn" class="btn btn-outline" style="padding: 8px 15px;">Logout</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="dashboard-container">
        <div class="welcome-box">
            <h2>Welcome Back, <span id="customerName">Customer</span>! 👋</h2>
            <p>Find the best service providers to get your projects done quickly.</p>
            <a href="post-request/post-request.html" class="btn btn-primary" style="background: white; color: #2563eb; display: inline-block; margin-top: 15px; text-decoration: none; padding: 10px 20px; border-radius: 10px; font-weight: 600;">Post a New Request</a>
        </div>

        <h3>Available Service Provider Services</h3>
        <div id="loadingServices" class="status-msg">Loading available services...</div>
        
        <div id="servicesGrid" class="dashboard-grid">
            </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script src="auth-status.js"></script>
    <script src="customer-dashboard.js"></script>
</body>
</html>
